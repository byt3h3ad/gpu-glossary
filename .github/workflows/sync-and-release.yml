name: Sync upstream and publish PDF

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/modal-labs/gpu-glossary.git
          git fetch upstream main

      - name: Merge upstream/main
        id: merge
        run: |
          if git merge upstream/main --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue on merge conflict
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Upstream sync conflict - manual merge required",
              body: "Automatic merge of upstream/main (modal-labs/gpu-glossary) into main failed due to conflicts. Run: git fetch upstream && git merge upstream/main locally, resolve conflicts, and push main to unblock the next scheduled sync.",
            });

      - name: Fail on conflict
        if: steps.merge.outputs.conflict == 'true'
        run: exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf2.0-0 libffi-dev shared-mime-info \
            fonts-dejavu-core fonts-noto-mono

      - name: Build and validate PDF
        run: uv run --python 3.12 --with-requirements utils/requirements.txt python utils/build_pdf.py

      - name: Push merged main
        run: git push origin main

      - name: Compute release tag
        id: tag
        run: |
          echo "tag=pdf-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.tag.outputs.tag }} already exists; skipping."
          else
            gh release create "${{ steps.tag.outputs.tag }}" \
              --title "GPU Glossary PDF - ${{ steps.tag.outputs.date }}" \
              --notes "Auto-generated printable PDF of the GPU Glossary, synced from modal-labs/gpu-glossary (https://github.com/modal-labs/gpu-glossary) at ${{ steps.tag.outputs.sha }}." \
              dist/gpu-glossary.pdf
          fi
